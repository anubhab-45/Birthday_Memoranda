<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রীতা — শুভ জন্মদিন ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07040a;
      --pink-primary: #ff5c9b;
      --pink-light: #ffc1d6;
      --gold-accent: #ffd700;
      --pink-gradient: linear-gradient(135deg, #ff4d88, #ff93b8);
      --gold-gradient: linear-gradient(135deg, #ffdf00, #d4af37);
      --glass-bg: rgba(15, 5, 12, 0.65);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.88);
      --font-bengali: 'Hind Siliguri', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-bengali);
      background: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 92, 155, 0.25), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.12), transparent 40%),
        linear-gradient(135deg, #0a0508, #1a0a14 60%, #050204);
    }

    .music-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 92, 155, 0.3);
    }

    .music-toggle:hover {
      transform: scale(1.1);
      background: rgba(255, 92, 155, 0.2);
    }

    .music-toggle.playing {
      animation: pulseMusic 2s infinite;
    }

    @keyframes pulseMusic {
      0% { box-shadow: 0 0 0 0 rgba(255, 92, 155, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(255, 92, 155, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 92, 155, 0); }
    }

    .deck {
      width: 100vw;
      height: 100vh;
      display: flex;
      transition: transform 0.8s cubic-bezier(0.8, 0, 0.2, 1);
      will-change: transform;
    }

    .slide {
      min-width: 100vw;
      height: 100vh;
      position: relative;
      overflow-y: auto;
      padding: 58px 5vw 82px;
      scrollbar-width: thin;
      scrollbar-color: var(--pink-primary) transparent;
    }

    .slide::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
    }

    .cover { display: grid; place-items: center; text-align: center; }

    .cover-card, .final-card {
      position: relative;
      z-index: 3;
      width: min(92vw, 760px);
      padding: 40px 25px;
      border-radius: 34px;
      background: var(--glass-bg);
      border: 1px solid rgba(255, 215, 0, 0.2); /* Slight gold border for birthday */
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 92, 155, 0.1);
      animation: lift 1s ease both;
    }

    @keyframes lift {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cake {
      font-size: clamp(75px, 16vw, 150px);
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.6));
      animation: bounceCake 2.5s ease-in-out infinite alternate;
      cursor: pointer;
    }

    @keyframes bounceCake {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-12px) scale(1.05); }
    }

    h1, h2, p { position: relative; z-index: 2; }

    .cover h1, .final-card h2 {
      margin-top: 10px;
      font-size: clamp(40px, 8vw, 80px);
      line-height: 1.2;
      background: linear-gradient(to right, #ff5c9b, #ffb6c1, #ff5c9b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 25px rgba(255, 92, 155, 0.4);
      font-weight: 700;
      animation: shimmer 3s infinite linear;
      background-size: 200% auto;
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }

    .cover h2 {
      margin-top: 15px;
      font-size: clamp(22px, 4vw, 36px);
      color: var(--gold-accent);
      font-weight: 700;
      letter-spacing: 2px;
    }

    .cover p {
      margin: 20px auto 0;
      max-width: 620px;
      font-size: clamp(16px, 2.2vw, 21px);
      line-height: 1.8;
      color: var(--text-muted);
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 999px;
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #fff1cc;
      font-weight: 600;
    }

    .start-btn {
      margin-top: 30px;
      border: 0;
      cursor: pointer;
      padding: 16px 40px;
      border-radius: 999px;
      background: var(--pink-gradient);
      color: white;
      font-size: 19px;
      font-weight: 700;
      font-family: var(--font-bengali);
      box-shadow: 0 15px 35px rgba(255, 77, 136, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .start-btn:hover {
      transform: scale(1.08) translateY(-4px);
      box-shadow: 0 20px 45px rgba(255, 77, 136, 0.6);
      background: linear-gradient(135deg, #ff6fa8, #ffb6c1);
    }

    .chapter-head {
      position: relative;
      z-index: 3;
      width: min(940px, 100%);
      margin: 0 auto 30px;
      text-align: center;
      padding: 22px 20px 28px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 215, 0, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .chapter-kicker {
      color: var(--gold-accent);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .chapter-head h2 {
      font-size: clamp(32px, 6vw, 60px);
      line-height: 1.2;
      margin-bottom: 15px;
      color: var(--pink-primary);
    }

    .chapter-head p {
      max-width: 780px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.85);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.8;
    }

    .memory-grid {
      position: relative;
      z-index: 3;
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 155px;
      gap: 16px;
    }

    .memory-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      opacity: 0;
      transform: translateY(25px) scale(0.96);
      animation: cardIn 0.8s ease forwards;
    }

    /* Assigning grid spans exactly as before to preserve structure */
    .memory-card:nth-child(1) { grid-column: span 2; grid-row: span 2; animation-delay: 0.1s; }
    .memory-card:nth-child(2) { grid-column: span 2; grid-row: span 1; animation-delay: 0.2s; }
    .memory-card:nth-child(3) { grid-column: span 2; grid-row: span 2; animation-delay: 0.3s; }
    .memory-card:nth-child(4) { grid-column: span 2; grid-row: span 1; animation-delay: 0.4s; }
    .memory-card:nth-child(5) { grid-column: span 2; grid-row: span 2; animation-delay: 0.5s; }
    .memory-card:nth-child(6) { grid-column: span 2; grid-row: span 1; animation-delay: 0.6s; }
    .memory-card:nth-child(7) { grid-column: span 3; grid-row: span 2; animation-delay: 0.7s; }
    .memory-card:nth-child(8) { grid-column: span 3; grid-row: span 2; animation-delay: 0.8s; }
    .memory-card:nth-child(9) { grid-column: span 2; grid-row: span 2; animation-delay: 0.9s; }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .memory-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease, filter 0.7s ease;
    }

    .memory-card:hover img {
      transform: scale(1.12);
      filter: brightness(1.15) contrast(1.05);
    }

    .memory-card::after {
      content: "✨";
      position: absolute;
      right: 15px;
      bottom: 12px;
      font-size: 22px;
      opacity: 0;
      transform: translateY(10px) scale(0.5);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .memory-card:hover::after {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .quote-box {
      position: relative;
      z-index: 3;
      width: min(850px, 100%);
      margin: 35px auto 0;
      padding: 22px 28px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(255, 92, 155, 0.15), rgba(255, 215, 0, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffe8f0;
      text-align: center;
      font-size: clamp(19px, 3vw, 28px);
      line-height: 1.6;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .video-grid {
      position: relative;
      z-index: 3;
      width: min(950px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    video {
      width: 100%;
      border-radius: 26px;
      background: #000;
      border: 2px solid rgba(255, 92, 155, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .final {
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(255, 215, 0, 0.15), transparent 50%),
        var(--bg-dark);
    }

    .final-card p {
      color: var(--text-muted);
      font-size: clamp(17px, 2.5vw, 23px);
      line-height: 1.9;
      margin-top: 15px;
    }

    .signature {
      margin-top: 35px;
      color: var(--gold-accent);
      font-size: 28px;
      font-weight: 700;
      font-style: italic;
      letter-spacing: 1px;
    }

    .progress {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      z-index: 70;
      width: min(480px, 85vw);
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(10, 5, 10, 0.7);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bar {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--gold-gradient); /* Gold for birthday vibe */
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .counter {
      min-width: 55px;
      text-align: right;
      color: rgba(255, 255, 255, 0.9);
      font-size: 15px;
      font-weight: 700;
    }

    .hint {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(10, 5, 10, 0.6);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      color: var(--gold-accent);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.5px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(10px);
    }

    .lightbox.active { display: grid; }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 20px 80px rgba(255, 92, 155, 0.3);
      animation: zoomIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes zoomIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-lightbox {
      position: fixed;
      top: 25px;
      right: 30px;
      color: white;
      font-size: 45px;
      cursor: pointer;
      z-index: 250;
      transition: all 0.3s ease;
    }

    .close-lightbox:hover { transform: scale(1.2) rotate(90deg); color: var(--pink-primary); }

    /* Birthday Floating Elements */
    .float-item {
      position: fixed;
      top: -20px;
      z-index: 1;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Fireworks/Confetti for Final Slide */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #f00;
      opacity: 0;
    }

    @media (max-width: 760px) {
      .slide { padding: 85px 5vw 95px; }
      
      .memory-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 165px;
        gap: 12px;
      }

      .memory-card,
      .memory-card:nth-child(n) {
        grid-column: span 1;
        grid-row: span 1;
        border-radius: 20px;
      }

      .memory-card:nth-child(1),
      .memory-card:nth-child(5) {
        grid-column: span 2;
        grid-row: span 2;
      }

      .chapter-head { margin-bottom: 20px; padding: 18px; }
      .quote-box { margin-top: 22px; padding: 18px; font-size: 17px; }
      .hint { width: max-content; max-width: 90vw; }
      .music-toggle { top: 75px; right: 15px; width: 40px; height: 40px; }
      .start-btn { padding: 14px 30px; font-size: 17px; }
    }
  </style>
</head>

        <div class="quote-box">${chapter.quote}</div>

      deck.appendChild(section);

    // Video Section
    const videoSection = document.createElement("section");
    videoSection.className = "slide";
    videoSection.innerHTML = `
      <div class="chapter-head">

    const finalSection = document.createElement("section");

    finalSection.innerHTML = `

        <h2>শুভ জন্মদিন রীতা ❤️</h2>

      </div>
    `;
    deck.appendChild(finalSection);

    // Navigation Logic
    let currentSlide = 0;
    let totalSlides = document.querySelectorAll(".slide").length;
    const counter = document.getElementById("counter");
    const barFill = document.getElementById("barFill");
    const bgMusic = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicToggle");

    function updateSlide() {
      deck.style.transform = `translateX(-${currentSlide * 100}vw)`;
      counter.textContent = `${currentSlide + 1} / ${totalSlides}`;
      barFill.style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;
      
      // Trigger confetti if it's the last slide
      if(currentSlide === totalSlides - 1) {
        triggerConfetti();
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlide();
    }

    function startJourney() {
      createBurst();
      setTimeout(() => goToSlide(1), 300); // slight delay for the burst effect
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          musicBtn.classList.add("playing");
        }).catch(err => console.log("Audio autoplay prevented"));
      }
    }

    function toggleMusic() {
      if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.classList.add("playing");
      } else {
        bgMusic.pause();
        musicBtn.classList.remove("playing");
      }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "Escape") closeLightbox();
    });

    let startX = 0, startY = 0, endX = 0, endY = 0;
    document.addEventListener("touchstart", e => {
      startX = e.changedTouches[0].screenX;
      startY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener("touchend", e => {
      endX = e.changedTouches[0].screenX;
      endY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = startX - endX;
      const diffY = startY - endY;
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 55) {
        if (diffX > 0) nextSlide();
        else prevSlide();
      }
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    // Floating Birthday Items
    const items = ["❤️", "✨", "🎈", "💕", "🌟"];
    function createFloatItem() {
      const item = document.createElement("div");
      item.className = "float-item";
      item.textContent = items[Math.floor(Math.random() * items.length)];
      item.style.left = Math.random() * 100 + "vw";
      item.style.fontSize = Math.random() * 15 + 15 + "px";
      item.style.animationDuration = Math.random() * 4 + 6 + "s";
      item.style.color = Math.random() > 0.5 ? "rgba(255, 120, 170, 0.4)" : "rgba(255, 215, 0, 0.4)";
      document.body.appendChild(item);
      setTimeout(() => item.remove(), 9000);
    }
    setInterval(createFloatItem, 700);

    // Confetti Effect for clicks and final slide
    function createBurst() {
      for(let i=0; i<30; i++) {
        const item = document.createElement("div");
        item.className = "float-item";
        item.textContent = items[Math.floor(Math.random() * items.length)];
        item.style.left = (50 + (Math.random() * 20 - 10)) + "vw";
        item.style.top = "50vh";
        item.style.fontSize = Math.random() * 20 + 20 + "px";
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = 100 + Math.random() * 100;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity - 150;
        
        item.style.transform = `translate(${tx}px, ${ty}px)`;
        item.style.transition = "transform 1.5s ease-out, opacity 1.5s";
        
        document.body.appendChild(item);
        
        setTimeout(() => {
          item.style.opacity = "0";
          item.style.transform = `translate(${tx}px, ${ty + 200}px)`;
        }, 50);
        
        setTimeout(() => item.remove(), 1500);
      }
    }

    function triggerConfetti() {
      const colors = ['#ff5c9b', '#ffd700', '#ffffff', '#ffb6c1'];
      for(let i=0; i<80; i++) {
        let conf = document.createElement('div');
        conf.style.position = 'absolute';
        conf.style.width = Math.random() * 10 + 5 + 'px';
        conf.style.height = Math.random() * 10 + 5 + 'px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.top = '-10px';
        conf.style.zIndex = '999';
        conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        document.body.appendChild(conf);

        let duration = Math.random() * 3 + 2;
        conf.animate([
          { transform: `translate3d(0,0,0) rotate(0deg)`, opacity: 1 },
          { transform: `translate3d(${Math.random()*200 - 100}px, 100vh, 0) rotate(${Math.random()*360}deg)`, opacity: 0 }
        ], {
          duration: duration * 1000,
          easing: 'cubic-bezier(.37,0,.63,1)',
          fill: 'forwards'
        });

        setTimeout(() => conf.remove(), duration * 1000);
      }
    }

    updateSlide();
  </script>
