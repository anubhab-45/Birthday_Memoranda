<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rita Dear — Birthday Memoranda ❤️</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07040a;
      color: #fff;
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 90, 150, 0.28), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(255, 190, 210, 0.18), transparent 35%),
        linear-gradient(135deg, #07040a, #130912 55%, #050505);
    }

    .deck {
      width: 100vw;
      height: 100vh;
      display: flex;
      transition: transform 0.75s cubic-bezier(.77,0,.18,1);
      will-change: transform;
    }

    .slide {
      min-width: 100vw;
      height: 100vh;
      position: relative;
      overflow-y: auto;
      padding: 58px 5vw 82px;
      scrollbar-width: thin;
      scrollbar-color: #ff5c9b transparent;
    }

    .slide::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.10) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: .18;
      z-index: 0;
    }

    .cover {
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.38), rgba(0,0,0,.92)),
        url("WhatsApp Image 2026-05-24 at 6.23.55 PM.jpeg");
      background-size: cover;
      background-position: center;
    }

    .cover-card, .final-card {
      position: relative;
      z-index: 3;
      width: min(92vw, 760px);
      padding: 26px 22px;
      border-radius: 34px;
      background: rgba(10, 5, 10, .58);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 90px rgba(0,0,0,.72);
      animation: lift .9s ease both;
    }

    @keyframes lift {
      from { opacity: 0; transform: translateY(22px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cake {
      font-size: clamp(72px, 16vw, 142px);
      filter: drop-shadow(0 0 28px rgba(255, 95, 150, .9));
      animation: floatCake 2.4s ease-in-out infinite alternate;
    }

    @keyframes floatCake {
      from { transform: translateY(0) rotate(-1deg); }
      to { transform: translateY(-10px) rotate(1deg); }
    }

    h1, h2, p { position: relative; z-index: 2; }

    .cover h1 {
      margin-top: 6px;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1.08;
      color: #ff5c9b;
      text-shadow: 0 0 28px rgba(255,92,155,.65);
    }

    .cover h2 {
      margin-top: 12px;
      font-size: clamp(20px, 4vw, 34px);
      color: #ffe1ec;
      font-weight: 750;
    }

    .cover p {
      margin: 18px auto 0;
      max-width: 620px;
      font-size: clamp(15px, 2vw, 19px);
      line-height: 1.85;
      color: rgba(255,255,255,.86);
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 11px 18px;
      border-radius: 999px;
      background: rgba(255,92,155,.20);
      border: 1px solid rgba(255,255,255,.18);
      color: #ffd7e6;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .start-btn {
      margin-top: 24px;
      border: 0;
      cursor: pointer;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff4d88, #ff93b8);
      color: white;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 18px 45px rgba(255,77,136,.35);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .start-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 20px 55px rgba(255,77,136,.55);
    }

    .chapter-head {
      position: relative;
      z-index: 3;
      width: min(940px, 100%);
      margin: 0 auto 28px;
      text-align: center;
      padding: 18px 18px 20px;
      border-radius: 30px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(10px);
    }

    .chapter-kicker {
      color: #ff6fa8;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chapter-head h2 {
      font-size: clamp(30px, 5.8vw, 58px);
      line-height: 1.08;
      margin-bottom: 12px;
    }

    .chapter-head p {
      max-width: 760px;
      margin: 0 auto;
      color: rgba(255,255,255,.78);
      font-size: clamp(14px, 2vw, 18px);
      line-height: 1.75;
    }

    .memory-grid {
      position: relative;
      z-index: 3;
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 145px;
      gap: 12px;
    }

    .memory-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
      cursor: pointer;
      opacity: 0;
      transform: translateY(18px) scale(.98);
      animation: cardIn .7s ease forwards;
    }

    .memory-card:nth-child(1) { grid-column: span 2; grid-row: span 2; animation-delay: .02s; }
    .memory-card:nth-child(2) { grid-column: span 2; grid-row: span 1; animation-delay: .08s; }
    .memory-card:nth-child(3) { grid-column: span 2; grid-row: span 2; animation-delay: .14s; }
    .memory-card:nth-child(4) { grid-column: span 2; grid-row: span 1; animation-delay: .20s; }
    .memory-card:nth-child(5) { grid-column: span 2; grid-row: span 2; animation-delay: .26s; }
    .memory-card:nth-child(6) { grid-column: span 2; grid-row: span 1; animation-delay: .32s; }
    .memory-card:nth-child(7) { grid-column: span 3; grid-row: span 2; animation-delay: .38s; }
    .memory-card:nth-child(8) { grid-column: span 3; grid-row: span 2; animation-delay: .44s; }
    .memory-card:nth-child(9) { grid-column: span 2; grid-row: span 2; animation-delay: .50s; }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .memory-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .65s ease, filter .65s ease;
    }

    .memory-card:hover img {
      transform: scale(1.08);
      filter: brightness(1.07) saturate(1.08);
    }

    .memory-card::after {
      content: "❤️";
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 18px;
      opacity: 0;
      transform: scale(.7);
      transition: .3s;
    }

    .memory-card:hover::after {
      opacity: .85;
      transform: scale(1);
    }

    .quote-box {
      position: relative;
      z-index: 3;
      width: min(820px, 100%);
      margin: 24px auto 0;
      padding: 18px 20px;
      border-radius: 26px;
      background: rgba(255,92,155,.11);
      border: 1px solid rgba(255,255,255,.13);
      color: #ffdce9;
      text-align: center;
      font-size: clamp(17px, 2.8vw, 26px);
      line-height: 1.65;
      font-weight: 750;
    }

    .video-grid {
      position: relative;
      z-index: 3;
      width: min(950px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 18px;
    }

    video {
      width: 100%;
      border-radius: 26px;
      background: #000;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
    }

    .final {
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(255,92,155,.22), transparent 42%),
        #07040a;
    }

    .final-card h2 {
      color: #ff5c9b;
      font-size: clamp(36px, 7vw, 78px);
      line-height: 1.12;
      margin-bottom: 18px;
    }

    .final-card p {
      color: rgba(255,255,255,.84);
      font-size: clamp(15px, 2.4vw, 22px);
      line-height: 1.9;
      margin-top: 14px;
    }

    .signature {
      margin-top: 26px;
      color: #ffdce9;
      font-size: 24px;
      font-weight: 900;
    }

    .progress {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 70;
      width: min(420px, 84vw);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.58);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bar {
      flex: 1;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff4d88, #ffc1d6);
      transition: width .45s ease;
    }

    .counter {
      min-width: 54px;
      text-align: right;
      color: rgba(255,255,255,.82);
      font-size: 13px;
      font-weight: 800;
    }

    .hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,.46);
      border: 1px solid rgba(255,255,255,.13);
      backdrop-filter: blur(12px);
      color: rgba(255,255,255,.78);
      font-size: 13px;
      text-align: center;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(0,0,0,.92);
    }

    .lightbox.active { display: grid; }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 22px;
      box-shadow: 0 20px 80px rgba(0,0,0,.85);
    }

    .close-lightbox {
      position: fixed;
      top: 16px;
      right: 22px;
      color: white;
      font-size: 42px;
      cursor: pointer;
      z-index: 250;
    }

    .heart {
      position: fixed;
      top: -20px;
      z-index: 1;
      pointer-events: none;
      color: rgba(255, 120, 170, .35);
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    @media (max-width: 760px) {
      .slide { padding: 58px 4vw 80px; }

      .memory-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 165px;
        gap: 10px;
      }

      .memory-card,
      .memory-card:nth-child(n) {
        grid-column: span 1;
        grid-row: span 1;
        border-radius: 20px;
      }

      .memory-card:nth-child(1),
      .memory-card:nth-child(5) {
        grid-column: span 2;
        grid-row: span 2;
      }

      .chapter-head { margin-bottom: 18px; padding: 16px; }
      .quote-box { margin-top: 18px; padding: 16px; }
      .hint { width: max-content; max-width: 92vw; }
    }
  </style>
</head>

          "WhatsApp Image 2026-05-24 at 6.23.52 PM (1).jpeg"
        ]
      },
      {
        kicker: "অধ্যায় ৮",
        title: "ছোট জিনিসগুলো",
        text: "ফুল, চুড়ি, হাতের লেখা, ছোট ছোট জিনিস—এসবই প্রমাণ করে স্মৃতি শুধু মুখে নয়, খুঁটিনাটিতেও থাকে।",
        quote: "ভালোবাসা অনেক সময় ছোট ছোট জিনিসে লুকিয়ে থাকে।",
        images: [
          "WhatsApp Image 2026-05-24 at 6.23.52 PM (2).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.52 PM.jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.53 PM (1).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.53 PM (2).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.53 PM.jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.54 PM (1).jpeg"
        ]
      },
      {
        kicker: "অধ্যায় ৯",
        title: "Rita-র সৌন্দর্য",
        text: "এই অধ্যায়টা Rita-র সেই ছবিগুলোর জন্য, যেখানে সে পরিণত, সুন্দর, কোমল আর একদম নিজের মতো।",
        quote: "কিছু মুখ কবিতার মতো মনে থাকে।",
        images: [
          "WhatsApp Image 2026-05-24 at 6.23.54 PM.jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.55 PM (1).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.55 PM (2).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.55 PM.jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.56 PM (1).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.56 PM (2).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.56 PM.jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.57 PM (1).jpeg",
          "WhatsApp Image 2026-05-24 at 6.23.57 PM.jpeg"
        ]
      }
    ];

    const videos = [
      "WhatsApp Video 2026-05-24 at 6.23.16 PM.mp4",
      "WhatsApp Video 2026-05-24 at 6.23.23 PM.mp4"
    ];

    const deck = document.getElementById("deck");

    chapters.forEach(chapter => {
      const section = document.createElement("section");
      section.className = "slide";

      section.innerHTML = `
        <div class="chapter-head">
          <div class="chapter-kicker">${chapter.kicker}</div>
          <h2>${chapter.title}</h2>
          <p>${chapter.text}</p>
        </div>

        <div class="memory-grid">
          ${chapter.images.map(img => `
            <div class="memory-card">
              <img src="${img}" alt="Rita memory" loading="lazy" onclick="openLightbox('${img}')">
            </div>
          `).join("")}
        </div>

        <div class="quote-box">${chapter.quote}</div>
      `;

      deck.appendChild(section);
    });

    const videoSection = document.createElement("section");
    videoSection.className = "slide";
    videoSection.innerHTML = `
      <div class="chapter-head">
        <div class="chapter-kicker">অধ্যায় ১০</div>
        <h2>চলমান স্মৃতি</h2>
        <p>কিছু স্মৃতি শুধু ছবি হয়ে থাকে না—সেগুলো নড়ে, হাসে, শ্বাস নেয়।</p>
      </div>

      <div class="video-grid">
        ${videos.map(video => `
          <video controls playsinline preload="metadata">
            <source src="${video}" type="video/mp4">
          </video>
        `).join("")}
      </div>

      <div class="quote-box">ছবি স্মৃতিকে থামিয়ে রাখে, ভিডিও স্মৃতিকে বাঁচিয়ে রাখে।</div>
    `;
    deck.appendChild(videoSection);

    const finalSection = document.createElement("section");
    finalSection.className = "slide final";
    finalSection.innerHTML = `
      <div class="final-card">
        <div class="cake">🎂</div>
        <h2>শুভ জন্মদিন Rita ❤️</h2>
        <p>
          ১৩/০৬/২০২৬ — এই ছোট্ট ওয়েবসাইটটা তোমার জন্য আমার উপহার।
          এটা নিখুঁত হওয়ার জন্য না, এটা সত্যি হওয়ার জন্য।
        </p>
        <p>
          কোটি কোটি মানুষের ভিড়ে, কোনোভাবে আমাদের দিনগুলো একে অপরকে খুঁজে পেয়েছিল।
          আর আমার জীবনের নরম স্মৃতিগুলোর মধ্যে তুমি সবসময় থাকবে।
        </p>
        <div class="signature">— Anubhab</div>
      </div>
    `;
    deck.appendChild(finalSection);

    let currentSlide = 0;
    let totalSlides = document.querySelectorAll(".slide").length;
    const counter = document.getElementById("counter");
    const barFill = document.getElementById("barFill");

    function updateSlide() {
      deck.style.transform = `translateX(-${currentSlide * 100}vw)`;
      counter.textContent = `${currentSlide + 1} / ${totalSlides}`;
      barFill.style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlide();
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "Escape") closeLightbox();
    });

    let startX = 0;
    let startY = 0;
    let endX = 0;
    let endY = 0;

    document.addEventListener("touchstart", e => {
      startX = e.changedTouches[0].screenX;
      startY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener("touchend", e => {
      endX = e.changedTouches[0].screenX;
      endY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = startX - endX;
      const diffY = startY - endY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 55) {
        if (diffX > 0) nextSlide();
        else prevSlide();
      }
    }

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = Math.random() > .5 ? "❤️" : "💕";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 15 + 12 + "px";
      heart.style.animationDuration = Math.random() * 4 + 5 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9000);
    }

    setInterval(createHeart, 850);
    updateSlide();
  </script>
</body>
