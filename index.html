<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rita Dear — Birthday Memoranda ❤️</title>

  <!-- Google Fonts for better Bengali Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables for easy theme management */
    :root {
      --bg-dark: #07040a;
      --pink-primary: #ff5c9b;
      --pink-light: #ffc1d6;
      --pink-gradient: linear-gradient(135deg, #ff4d88, #ff93b8);
      --glass-bg: rgba(10, 5, 10, 0.58);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.86);
      --font-bengali: 'Hind Siliguri', sans-serif;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-bengali);
      background: var(--bg-dark);
      color: var(--text-main);
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 90, 150, 0.28), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(255, 190, 210, 0.18), transparent 35%),
        linear-gradient(135deg, #07040a, #130912 55%, #050505);
    }

    /* Background Music Button */
    .music-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 92, 155, 0.3);
    }

    .music-toggle:hover {
      transform: scale(1.1);
      background: rgba(255, 92, 155, 0.2);
    }

    .music-toggle.playing {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 92, 155, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(255, 92, 155, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 92, 155, 0); }
    }

    .deck {
      width: 100vw;
      height: 100vh;
      display: flex;
      transition: transform 0.75s cubic-bezier(0.77, 0, 0.18, 1);
      will-change: transform;
    }

    .slide {
      min-width: 100vw;
      height: 100vh;
      position: relative;
      overflow-y: auto;
      padding: 58px 5vw 82px;
      scrollbar-width: thin;
      scrollbar-color: var(--pink-primary) transparent;
    }

    .slide::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.10) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.18;
      z-index: 0;
    }

    /* Cover Styling */
    .cover {
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
    }

    .cover-card, .final-card {
      position: relative;
      z-index: 3;
      width: min(92vw, 760px);
      padding: 35px 25px;
      border-radius: 34px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.72);
      animation: lift 0.9s ease both;
    }

    @keyframes lift {
      from { opacity: 0; transform: translateY(22px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cake {
      font-size: clamp(72px, 16vw, 142px);
      filter: drop-shadow(0 0 28px rgba(255, 95, 150, 0.9));
      animation: floatCake 2.4s ease-in-out infinite alternate;
    }

    @keyframes floatCake {
      from { transform: translateY(0) rotate(-1deg); }
      to { transform: translateY(-10px) rotate(1deg); }
    }

    h1, h2, p { position: relative; z-index: 2; }

    .cover h1 {
      margin-top: 6px;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1.2;
      color: var(--pink-primary);
      text-shadow: 0 0 28px rgba(255, 92, 155, 0.65);
      font-weight: 700;
    }

    .cover h2 {
      margin-top: 12px;
      font-size: clamp(20px, 4vw, 34px);
      color: #ffe1ec;
      font-weight: 700;
    }

    .cover p {
      margin: 18px auto 0;
      max-width: 620px;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.85;
      color: var(--text-muted);
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 11px 22px;
      border-radius: 999px;
      background: rgba(255, 92, 155, 0.20);
      border: 1px solid var(--glass-border);
      color: #ffd7e6;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .start-btn {
      margin-top: 28px;
      border: 0;
      cursor: pointer;
      padding: 15px 35px;
      border-radius: 999px;
      background: var(--pink-gradient);
      color: white;
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font-bengali);
      box-shadow: 0 18px 45px rgba(255, 77, 136, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .start-btn:hover {
      transform: scale(1.06) translateY(-3px);
      box-shadow: 0 25px 55px rgba(255, 77, 136, 0.55);
    }

    /* Chapter Headers */
    .chapter-head {
      position: relative;
      z-index: 3;
      width: min(940px, 100%);
      margin: 0 auto 28px;
      text-align: center;
      padding: 20px 20px 25px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
    }

    .chapter-kicker {
      color: #ff6fa8;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .chapter-head h2 {
      font-size: clamp(30px, 5.8vw, 58px);
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .chapter-head p {
      max-width: 760px;
      margin: 0 auto;
      color: rgba(255, 255, 255, 0.78);
      font-size: clamp(15px, 2vw, 19px);
      line-height: 1.75;
    }

    /* Grids & Memories */
    .memory-grid {
      position: relative;
      z-index: 3;
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 150px;
      gap: 15px;
    }

    .memory-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      animation: cardIn 0.7s ease forwards;
    }

    .memory-card:nth-child(1) { grid-column: span 2; grid-row: span 2; animation-delay: 0.02s; }
    .memory-card:nth-child(2) { grid-column: span 2; grid-row: span 1; animation-delay: 0.08s; }
    .memory-card:nth-child(3) { grid-column: span 2; grid-row: span 2; animation-delay: 0.14s; }
    .memory-card:nth-child(4) { grid-column: span 2; grid-row: span 1; animation-delay: 0.20s; }
    .memory-card:nth-child(5) { grid-column: span 2; grid-row: span 2; animation-delay: 0.26s; }
    .memory-card:nth-child(6) { grid-column: span 2; grid-row: span 1; animation-delay: 0.32s; }
    .memory-card:nth-child(7) { grid-column: span 3; grid-row: span 2; animation-delay: 0.38s; }
    .memory-card:nth-child(8) { grid-column: span 3; grid-row: span 2; animation-delay: 0.44s; }
    .memory-card:nth-child(9) { grid-column: span 2; grid-row: span 2; animation-delay: 0.50s; }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .memory-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.65s ease, filter 0.65s ease;
    }

    .memory-card:hover img {
      transform: scale(1.1);
      filter: brightness(1.1) saturate(1.1);
    }

    .memory-card::after {
      content: "❤️";
      position: absolute;
      right: 15px;
      bottom: 12px;
      font-size: 20px;
      opacity: 0;
      transform: scale(0.5);
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .memory-card:hover::after {
      opacity: 1;
      transform: scale(1);
    }

    .quote-box {
      position: relative;
      z-index: 3;
      width: min(820px, 100%);
      margin: 30px auto 0;
      padding: 20px 25px;
      border-radius: 26px;
      background: rgba(255, 92, 155, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: #ffdce9;
      text-align: center;
      font-size: clamp(18px, 2.8vw, 26px);
      line-height: 1.65;
      font-weight: 600;
    }

    .video-grid {
      position: relative;
      z-index: 3;
      width: min(950px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
    }

    video {
      width: 100%;
      border-radius: 26px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    /* Final Slide */
    .final {
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(255, 92, 155, 0.22), transparent 42%),
        var(--bg-dark);
    }

    .final-card h2 {
      color: var(--pink-primary);
      font-size: clamp(36px, 7vw, 78px);
      line-height: 1.2;
      margin-bottom: 18px;
    }

    .final-card p {
      color: var(--text-muted);
      font-size: clamp(16px, 2.4vw, 22px);
      line-height: 1.9;
      margin-top: 14px;
    }

    .signature {
      margin-top: 30px;
      color: #ffdce9;
      font-size: 26px;
      font-weight: 700;
      font-style: italic;
    }

    /* UI Elements */
    .progress {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 70;
      width: min(450px, 85vw);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .bar {
      flex: 1;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--pink-gradient);
      transition: width 0.45s ease;
    }

    .counter {
      min-width: 54px;
      text-align: right;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 700;
    }

    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(8px);
    }

    .lightbox.active { display: grid; }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.85);
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-lightbox {
      position: fixed;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 45px;
      cursor: pointer;
      z-index: 250;
      transition: transform 0.2s;
    }

    .close-lightbox:hover { transform: scale(1.1) rotate(90deg); color: var(--pink-primary); }

    /* Hearts */
    .heart {
      position: fixed;
      top: -20px;
      z-index: 1;
      pointer-events: none;
      color: rgba(255, 120, 170, 0.35);
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Responsive Design */
    @media (max-width: 760px) {
      .slide { padding: 80px 5vw 90px; }
      
      .memory-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 165px;
        gap: 12px;
      }

      .memory-card,
      .memory-card:nth-child(n) {
        grid-column: span 1;
        grid-row: span 1;
        border-radius: 20px;
      }

      .memory-card:nth-child(1),
      .memory-card:nth-child(5) {
        grid-column: span 2;
        grid-row: span 2;
      }

      .chapter-head { margin-bottom: 18px; padding: 18px; }
      .quote-box { margin-top: 20px; padding: 18px; }
      .hint { width: max-content; max-width: 90vw; }
      .music-toggle { top: 70px; right: 15px; } /* Moved slightly down on mobile so it doesn't overlap hint */
    }
  </style>
</head>

    <img id="lightboxImg" src="" alt="Rita memory">

    const deck = document.getElementById("deck");

    // Dynamic Element Generation
    chapters.forEach(chapter => {
      const section = document.createElement("section");
      section.className = "slide";

      section.innerHTML = `
        <div class="chapter-head">
          <div class="chapter-kicker">${chapter.kicker}</div>
          <h2>${chapter.title}</h2>
          <p>${chapter.text}</p>
        </div>

        <div class="memory-grid">
          ${chapter.images.map(img => `
            <div class="memory-card">
              <img src="${img}" alt="Rita memory" loading="lazy" onclick="openLightbox('${img}')">
            </div>
          `).join("")}
        </div>

        <div class="quote-box">${chapter.quote}</div>
      `;

      deck.appendChild(section);
    });

    // Video Section
    const videoSection = document.createElement("section");
    videoSection.className = "slide";
    videoSection.innerHTML = `
      <div class="chapter-head">
        <div class="chapter-kicker">অধ্যায় ১০</div>
        <h2>চলমান স্মৃতি</h2>
        <p>কিছু স্মৃতি শুধু ছবি হয়ে থাকে না—সেগুলো নড়ে, হাসে, শ্বাস নেয়।</p>
      </div>

      <div class="video-grid">
        ${videos.map(video => `
          <video controls playsinline preload="metadata">
            <source src="${video}" type="video/mp4">
          </video>
        `).join("")}
      </div>

      <div class="quote-box">ছবি স্মৃতিকে থামিয়ে রাখে, ভিডিও স্মৃতিকে বাঁচিয়ে রাখে।</div>

    // Final Section
    const finalSection = document.createElement("section");
    finalSection.className = "slide final";
    finalSection.innerHTML = `
      <div class="final-card">
        <div class="cake">🎂</div>
        <h2>শুভ জন্মদিন Rita ❤️</h2>
        <p>
          ১৩/০৬/২০২৬ — এই ছোট্ট ওয়েবসাইটটা তোমার জন্য আমার উপহার।
          এটা নিখুঁত হওয়ার জন্য না, এটা সত্যি হওয়ার জন্য।
        </p>

          আর আমার জীবনের নরম স্মৃতিগুলোর মধ্যে তুমি সবসময় থাকবে।
        </p>
        <div class="signature">— Anubhab</div>
      </div>
    `;
    deck.appendChild(finalSection);

    // Navigation Logic
    let currentSlide = 0;
    let totalSlides = document.querySelectorAll(".slide").length;
    const counter = document.getElementById("counter");
    const barFill = document.getElementById("barFill");
    const bgMusic = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicToggle");

    function updateSlide() {
      deck.style.transform = `translateX(-${currentSlide * 100}vw)`;
      counter.textContent = `${currentSlide + 1} / ${totalSlides}`;
      barFill.style.width = `${((currentSlide + 1) / totalSlides) * 100}%`;
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function goToSlide(index) {
      currentSlide = index;
      updateSlide();
    }

    // Music & Start Journey Function
    function startJourney() {
      goToSlide(1);
      // Try to play music when user first interacts
      if (bgMusic.paused) {
        bgMusic.play().then(() => {
          musicBtn.classList.add("playing");
        }).catch(err => console.log("Audio autoplay prevented by browser"));
      }
    }

    function toggleMusic() {
      if (bgMusic.paused) {
        bgMusic.play();
        musicBtn.classList.add("playing");
      } else {
        bgMusic.pause();
        musicBtn.classList.remove("playing");
      }
    }

    // Event Listeners (Keyboard & Touch)
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "Escape") closeLightbox();
    });

    let startX = 0;
    let startY = 0;
    let endX = 0;
    let endY = 0;

    document.addEventListener("touchstart", e => {
      startX = e.changedTouches[0].screenX;
      startY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener("touchend", e => {
      endX = e.changedTouches[0].screenX;
      endY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = startX - endX;
      const diffY = startY - endY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 55) {
        if (diffX > 0) nextSlide();
        else prevSlide();
      }
    }

    // Lightbox Logic
    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    // Heart Animation Logic
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = Math.random() > 0.5 ? "❤️" : "💕";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 15 + 14 + "px";
      heart.style.animationDuration = Math.random() * 4 + 6 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9000);
    }

    setInterval(createHeart, 850);
    updateSlide();
  </script>
